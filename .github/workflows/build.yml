name: Build and Release Binaries

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-linux-x86_64:
    name: Linux (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        timeout-minutes: 10
        run: |
          APT_OPTS=(
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
            -o Acquire::ForceIPv4=true
          )
          sudo apt-get "${APT_OPTS[@]}" update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get "${APT_OPTS[@]}" install -y -qq --no-install-recommends \
            -o Dpkg::Options::="--force-confdef" \
            -o Dpkg::Options::="--force-confold" \
            build-essential \
            cmake \
            ninja-build \
            qtbase5-dev \
            libxml2-dev \
            zlib1g-dev \
            liblzma-dev \
            libuchardet-dev \
            libcapnp-dev \
            capnproto \
            libboost-dev \
            libboost-nowide-dev \
            dpkg-dev \
            zstd \
            zip

      - name: Download Prebuilt Minimal Static OpenCV (third-party-v1)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view third-party-v1 --repo "$GH_REPO" --json assets --jq '.assets[].name' 2>/dev/null \
              | grep -q '^opencv-.*-minimal-linux-x86_64\.tar\.zst$'; then
            mkdir -p /tmp/ocv_dl third_party/opencv/linux-x86_64
            gh release download third-party-v1 \
              --repo "$GH_REPO" \
              --pattern "opencv-*-minimal-linux-x86_64.tar.zst" \
              --dir /tmp/ocv_dl
            ARCHIVE=$(ls -1v /tmp/ocv_dl/opencv-*-minimal-linux-x86_64.tar.zst | tail -n 1)
            tar --zstd -xf "$ARCHIVE" -C third_party/opencv/linux-x86_64
            rm -rf /tmp/ocv_dl
            echo "Installed prebuilt minimal static OpenCV for Linux."
          else
            echo "::notice::Prebuilt OpenCV archive not yet published in third-party-v1; falling back to system libopencv-dev."
            sudo DEBIAN_FRONTEND=noninteractive apt-get \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30 \
              -o Acquire::ForceIPv4=true \
              install -y -qq --no-install-recommends libopencv-dev
          fi

      - name: Download Prebuilt Minimal Static LibArchive (third-party-v1)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view third-party-v1 --repo "$GH_REPO" --json assets --jq '.assets[].name' 2>/dev/null \
              | grep -q '^libarchive-.*-minimal-linux-x86_64\.tar\.zst$'; then
            mkdir -p /tmp/la_dl third_party/libarchive/linux-x86_64
            gh release download third-party-v1 \
              --repo "$GH_REPO" \
              --pattern "libarchive-*-minimal-linux-x86_64.tar.zst" \
              --dir /tmp/la_dl
            ARCHIVE=$(ls -1v /tmp/la_dl/libarchive-*-minimal-linux-x86_64.tar.zst | tail -n 1)
            tar --zstd -xf "$ARCHIVE" -C third_party/libarchive/linux-x86_64
            rm -rf /tmp/la_dl
            echo "Installed prebuilt minimal static LibArchive for Linux."
          else
            echo "::notice::Prebuilt LibArchive archive not yet published in third-party-v1; falling back to system libarchive-dev."
            sudo DEBIAN_FRONTEND=noninteractive apt-get \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30 \
              -o Acquire::ForceIPv4=true \
              install -y -qq --no-install-recommends libarchive-dev
          fi

      - name: Build and Run Automated Test Suite (CTest Quality Gate)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cmake -B build_test -S . -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTS=ON
          cmake --build build_test -j$(nproc)
          ./build_test/build_dat_dict "third_party/cppjieba/dict/jieba.dict.utf8" "third_party/cppjieba/dict/jieba_dat.bin"
          if ! ctest --test-dir build_test --output-on-failure --timeout 180 -j1; then
            echo "CTest encountered failures. Dumping logs..."
            if [ -f build_test/Testing/Temporary/LastTest.log ]; then
              tail -n 100 build_test/Testing/Temporary/LastTest.log
            fi
            exit 1
          fi

      - name: Upload Linux CTest Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-ctest-logs
          path: build_test/Testing/Temporary/

      - name: Build and Package Linux Release
        run: |
          chmod +x scripts/package.sh scripts/package_deb.sh
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            TAG="$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || true)"
            VERSION="${TAG#v}"
            VERSION="${VERSION:-0.4.6}"
          fi
          ./scripts/package.sh "${VERSION}"
          ./scripts/package_deb.sh "${VERSION}" --stage-dir "dist/soeasy-v${VERSION}-linux-x86_64"

      - name: Smoke Test Linux .deb in Clean Container
        run: |
          docker run --rm -v "$(pwd)/dist:/dist:ro" ubuntu:24.04 bash -ec '
            set -euo pipefail
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
              desktop-file-utils \
              xvfb \
              /dist/soeasy_*.deb

            desktop-file-validate /usr/share/applications/soeasy.desktop

            # Verify no missing shared libraries for installed binaries and Qt xcb plugin
            LD_LIBRARY_PATH=/opt/soeasy/lib ldd /opt/soeasy/bin/soeasy-gui /opt/soeasy/bin/soeasy-worker /opt/soeasy/bin/soeasy-cli /opt/soeasy/plugins/platforms/libqxcb.so \
              | grep "not found" && exit 1 || true

            # Verify CLI works from an arbitrary working directory without --dict
            (cd /tmp && soeasy-cli stats -v -d /tmp/soeasy_deb_smoke.db)
            rm -f /tmp/soeasy_deb_smoke.db*

            # Verify GUI starts under virtual X11 display without immediate crash (exit 124 = timeout as expected)
            set +e
            xvfb-run -a timeout 4s /usr/bin/soeasy-gui --no-log-console
            GUI_RC=$?
            set -e
            if [ "${GUI_RC}" -ne 0 ] && [ "${GUI_RC}" -ne 124 ]; then
              echo "Error: soeasy-gui exited unexpectedly with code ${GUI_RC}" >&2
              exit 1
            fi

            # Verify clean purge removal
            DEBIAN_FRONTEND=noninteractive apt-get remove --purge -y -qq soeasy
            test ! -e /opt/soeasy
            test ! -e /usr/share/applications/soeasy.desktop
          '

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: soeasy-linux-x86_64
          path: |
            dist/soeasy-*.zip
            dist/soeasy_*.deb

  build-windows-x64:
    name: Windows (x64)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      MINGW_PREFIX: D:/msys64/mingw64
      QT_ROOT_DIR: D:/msys64/opt/qt5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download and Extract Prebuilt Windows Env (win-env-v1)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download win-env-v1 \
            --repo "$GH_REPO" \
            --pattern "soeasy-win64-msys2-env.tar.zst" \
            --dir "D:/"
          rm -rf "/d/msys64" "/d/msys64_tmp"
          mkdir -p "/d/msys64_tmp"
          if command -v zstd >/dev/null 2>&1; then
            tar --warning=no-unknown-keyword --zstd -xf "/d/soeasy-win64-msys2-env.tar.zst" -C "/d/msys64_tmp"
          else
            7z x "D:/soeasy-win64-msys2-env.tar.zst" -so | tar --warning=no-unknown-keyword -xf - -C "/d/msys64_tmp"
          fi
          if [ -d "/d/msys64_tmp/msys64/mingw64" ]; then
            mv "/d/msys64_tmp/msys64" "/d/msys64"
            rm -rf "/d/msys64_tmp"
          else
            mv "/d/msys64_tmp" "/d/msys64"
          fi
          rm -f "/d/soeasy-win64-msys2-env.tar.zst"
          ls -la "/d/msys64" "/d/msys64/opt/qt5/lib/cmake/Qt5/Qt5Config.cmake"
          echo "D:\msys64\mingw64\bin" >> "$GITHUB_PATH"
          echo "D:\msys64\usr\bin" >> "$GITHUB_PATH"

      - name: Download Prebuilt Minimal Static OpenCV (third-party-v1)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view third-party-v1 --repo "$GH_REPO" --json assets --jq '.assets[].name' 2>/dev/null \
              | grep -q '^opencv-.*-minimal-windows-x64\.tar\.zst$'; then
            mkdir -p /d/ocv_dl third_party/opencv/windows-x64
            gh release download third-party-v1 \
              --repo "$GH_REPO" \
              --pattern "opencv-*-minimal-windows-x64.tar.zst" \
              --dir "D:/ocv_dl"
            ARCHIVE=$(ls -1v /d/ocv_dl/opencv-*-minimal-windows-x64.tar.zst | tail -n 1)
            if command -v zstd >/dev/null 2>&1; then
              tar --warning=no-unknown-keyword --zstd -xf "$ARCHIVE" -C third_party/opencv/windows-x64
            else
              7z x "$(cygpath -w "$ARCHIVE")" -so | tar --warning=no-unknown-keyword -xf - -C third_party/opencv/windows-x64
            fi
            rm -rf /d/ocv_dl
            echo "Installed prebuilt minimal static OpenCV for Windows."
          else
            echo "::notice::Prebuilt OpenCV archive not yet published in third-party-v1; falling back to MSYS2 OpenCV."
          fi

      - name: Download Prebuilt Minimal Static LibArchive (third-party-v1)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view third-party-v1 --repo "$GH_REPO" --json assets --jq '.assets[].name' 2>/dev/null \
              | grep -q '^libarchive-.*-minimal-windows-x64\.tar\.zst$'; then
            mkdir -p /d/la_dl third_party/libarchive/windows-x64
            gh release download third-party-v1 \
              --repo "$GH_REPO" \
              --pattern "libarchive-*-minimal-windows-x64.tar.zst" \
              --dir "D:/la_dl"
            ARCHIVE=$(ls -1v /d/la_dl/libarchive-*-minimal-windows-x64.tar.zst | tail -n 1)
            if command -v zstd >/dev/null 2>&1; then
              tar --warning=no-unknown-keyword --zstd -xf "$ARCHIVE" -C third_party/libarchive/windows-x64
            else
              7z x "$(cygpath -w "$ARCHIVE")" -so | tar --warning=no-unknown-keyword -xf - -C third_party/libarchive/windows-x64
            fi
            rm -rf /d/la_dl
            echo "Installed prebuilt minimal static LibArchive for Windows."
          else
            echo "::notice::Prebuilt LibArchive archive not yet published in third-party-v1; checking MSYS2 LibArchive."
          fi

      - name: Build SoEasy and Test Suite (Windows x64)
        run: |
          cmake -B build -S . -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=ON \
            -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR};${MINGW_PREFIX}"
          cmake --build build -j4

      - name: Deploy Runtime DLLs to Build Directory
        run: |
          QT_UNIX_DIR=$(cygpath -u "${QT_ROOT_DIR}")
          # Copy third-party runtime DLLs to build directory (same directory as test executables)
          cp -p third_party/doctotext/lib/*.dll build/ 2>/dev/null || true
          cp -p third_party/onnxruntime/lib/*.dll build/ 2>/dev/null || true

          # Deploy Official Qt dependencies and plugins into build directory
          "${QT_UNIX_DIR}/bin/windeployqt.exe" --release --no-translations --no-opengl-sw build/soeasy-gui.exe || true

          # Ensure headless offscreen platform plugin is also deployed for CI testing
          mkdir -p build/platforms
          cp -p "${QT_UNIX_DIR}/plugins/platforms/"*.dll build/platforms/ 2>/dev/null || true

          # Ensure MSYS2 GCC newer C++ runtime overrides any older runtime copied by windeployqt
          cp -p ${MINGW_PREFIX}/bin/libgcc*.dll build/ 2>/dev/null || true
          cp -p ${MINGW_PREFIX}/bin/libstdc*.dll build/ 2>/dev/null || true
          cp -p ${MINGW_PREFIX}/bin/libwinpthread*.dll build/ 2>/dev/null || true

          # Automated recursive PE dependency convergence for test executables
          export PYTHONIOENCODING=utf-8
          python3 scripts/collect_win64_deps.py \
            --target-dir build \
            --search-dirs \
              "${MINGW_PREFIX}/bin" \
              "${QT_UNIX_DIR}/bin" \
              third_party/doctotext/lib \
              third_party/onnxruntime/lib

      - name: Build DAT Dictionary
        run: |
          ./build/build_dat_dict.exe "third_party/cppjieba/dict/jieba.dict.utf8" "third_party/cppjieba/dict/jieba_dat.bin"

      - name: Run Automated Test Suite (Windows CTest Quality Gate)
        env:
          QT_QPA_PLATFORM: offscreen
          QT_PLUGIN_PATH: ${{ github.workspace }}/build
          TMP: D:/tmp
          TEMP: D:/tmp
        run: |
          mkdir -p /tmp /d/tmp D:/tmp 2>/dev/null || true
          QT_UNIX_DIR=$(cygpath -u "${QT_ROOT_DIR}")
          export QT_PLUGIN_PATH="$(pwd)/build:${QT_UNIX_DIR}/plugins:${QT_PLUGIN_PATH}"
          if ! ctest --test-dir build --output-on-failure --timeout 180 -j1; then
            STEP_SUMMARY_PATH=$(cygpath -u "${GITHUB_STEP_SUMMARY:-/tmp/step_summary.md}" 2>/dev/null || echo "${GITHUB_STEP_SUMMARY}")
            echo "### ❌ Windows CTest Failure Report" >> "${STEP_SUMMARY_PATH}"
            if [ -f build/Testing/Temporary/LastTestsFailed.log ]; then
              echo "#### Failed Test List:" >> "${STEP_SUMMARY_PATH}"
              while IFS= read -r line; do
                echo "- \`${line}\`" >> "${STEP_SUMMARY_PATH}"
                echo "::error title=FailedTest::${line}"
              done < build/Testing/Temporary/LastTestsFailed.log
            fi
            if [ -f build/Testing/Temporary/LastTest.log ]; then
              python3 -c 'import sys; [print("::error title=OfficeFail::" + l.strip()) for l in open("build/Testing/Temporary/LastTest.log", errors="ignore") if "CHECK FAILED" in l]' 2>/dev/null || true
            fi
            if grep -q "test_office_parser" build/Testing/Temporary/LastTestsFailed.log 2>/dev/null; then
              echo ">>> Diagnostic direct run of test_office_parser.exe:"
              export PATH="$(pwd)/build:${PATH}"
              (cd build && ./test_office_parser.exe 2>&1) | while IFS= read -r l; do
                echo "::error title=OfficeDirect::${l}"
              done || true
            fi
            exit 1
          fi

      - name: Upload Windows CTest Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-ctest-logs
          path: build/Testing/Temporary/

      - name: Install NSIS (Windows Installer Builder)
        run: |
          choco.exe install nsis -y --no-progress

      - name: Package Windows Artifacts
        run: |
          QT_UNIX_DIR=$(cygpath -u "${QT_ROOT_DIR}")
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            TAG="$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || true)"
            VERSION="${TAG#v}"
            VERSION="${VERSION:-0.4.6}"
          fi
          # Extract numeric X.Y.Z for NSIS VIProductVersion (X.Y.Z.0)
          NUMERIC_VER="$(echo "${VERSION}" | grep -oE '^[0-9]+(\.[0-9]+){0,2}' || echo "0.4.6")"
          IFS='.' read -r V1 V2 V3 <<< "${NUMERIC_VER}"
          VI_VERSION="${V1:-0}.${V2:-0}.${V3:-0}.0"

          DIST_NAME="soeasy-v${VERSION}-windows-x64"
          STAGE_DIR="dist/${DIST_NAME}"
          rm -rf "${STAGE_DIR}" "dist/${DIST_NAME}.zip" "dist/${DIST_NAME}-setup.exe"

          chmod +x scripts/package_win64_stage.sh
          ./scripts/package_win64_stage.sh \
            --build-dir build \
            --stage-dir "${STAGE_DIR}" \
            --mingw-bin "${MINGW_PREFIX}/bin" \
            --qt-dir "${QT_UNIX_DIR}" \
            --windeployqt "${QT_UNIX_DIR}/bin/windeployqt.exe" \
            --build-dat-dict "./build/build_dat_dict.exe"

          (cd dist && zip -r -q "${DIST_NAME}.zip" "${DIST_NAME}")

          # Build NSIS Setup Installer (.exe)
          MAKENSIS_BIN="$(command -v makensis || echo "/c/Program Files (x86)/NSIS/makensis.exe")"
          "${MAKENSIS_BIN}" \
            "-DVERSION=${VERSION}" \
            "-DVI_VERSION=${VI_VERSION}" \
            "-DSTAGE_DIR=$(cygpath -w "$(pwd)/${STAGE_DIR}")" \
            "-DOUT_FILE=$(cygpath -w "$(pwd)/dist/${DIST_NAME}-setup.exe")" \
            "packaging/windows/soeasy.nsi"

      - name: Smoke Test Windows NSIS Installer (.exe)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-Item "dist\soeasy-*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS setup installer not found in dist\" }

          Write-Host "Running silent NSIS install: $($installer.FullName)"
          $installProc = Start-Process -FilePath $installer.FullName -ArgumentList "/S" -Wait -PassThru
          if ($installProc.ExitCode -ne 0) {
            throw "Installer failed with exit code $($installProc.ExitCode)"
          }

          $installDir = "$env:ProgramFiles\SoEasy"
          $desktopShortcut = "$env:Public\Desktop\SoEasy.lnk"
          $startMenuShortcut = "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\SoEasy\SoEasy.lnk"
          $uninstallReg = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\SoEasy"

          foreach ($path in @(
            "$installDir\soeasy-gui.exe",
            "$installDir\soeasy-worker.exe",
            "$installDir\soeasy-cli.exe",
            "$installDir\platforms\qwindows.dll",
            "$installDir\dict\jieba_dat.bin",
            "$installDir\Uninstall.exe",
            $desktopShortcut,
            $startMenuShortcut,
            $uninstallReg
          )) {
            if (-not (Test-Path $path)) {
              throw "Expected installed artifact missing: $path"
            }
          }

          # Strip MSYS2/Qt from PATH so we verify the installed package is 100% self-contained
          $origPath = $env:PATH
          try {
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\Wbem"
            Push-Location $env:TEMP
            try {
              $smokeDb = Join-Path $env:TEMP "soeasy_win_smoke.db"
              & "$installDir\soeasy-cli.exe" stats -v -d $smokeDb
              if ($LASTEXITCODE -ne 0) {
                throw "soeasy-cli.exe failed with exit code $LASTEXITCODE"
              }
              Remove-Item "$smokeDb*" -Force -ErrorAction SilentlyContinue
            } finally {
              Pop-Location
            }

            $guiProc = Start-Process -FilePath "$installDir\soeasy-gui.exe" -ArgumentList "--no-log-console" -PassThru
            Start-Sleep -Seconds 3
            if ($guiProc.HasExited) {
              throw "soeasy-gui.exe exited prematurely with code $($guiProc.ExitCode)"
            }
            Stop-Process -Id $guiProc.Id -Force -ErrorAction SilentlyContinue
            Get-Process -Name "soeasy-worker" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          } finally {
            $env:PATH = $origPath
          }

          Write-Host "Running silent NSIS uninstall..."
          Start-Process -FilePath "$installDir\Uninstall.exe" -ArgumentList "/S" | Out-Null

          # NSIS uninstaller spawns a temp copy for self-deletion; poll until cleanup completes
          $deadline = (Get-Date).AddSeconds(20)
          while ((Get-Date) -lt $deadline) {
            if (-not (Test-Path $installDir) -and -not (Test-Path $desktopShortcut) -and -not (Test-Path $uninstallReg)) {
              break
            }
            Start-Sleep -Milliseconds 500
          }
          if ((Test-Path $installDir) -or (Test-Path $desktopShortcut) -or (Test-Path $uninstallReg)) {
            throw "Uninstall cleanup incomplete: installDir=$(Test-Path $installDir), shortcut=$(Test-Path $desktopShortcut), reg=$(Test-Path $uninstallReg)"
          }
          Write-Host "Windows NSIS install/run/uninstall smoke test passed!"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: soeasy-windows-x64
          path: |
            dist/soeasy-*.zip
            dist/soeasy-*-setup.exe

  release:
    name: Publish GitHub Release
    needs: [build-linux-x86_64, build-windows-x64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256 Checksums
        run: |
          (cd artifacts && sha256sum soeasy* > SHA256SUMS.txt)
          cat artifacts/SHA256SUMS.txt

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.deb
            artifacts/*.exe
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
