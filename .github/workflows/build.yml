name: Build and Release Binaries

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-linux-x86_64:
    name: Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            qtbase5-dev \
            libopencv-dev \
            libxml2-dev \
            zlib1g-dev \
            libuchardet-dev \
            libcapnp-dev \
            capnproto \
            zip

      - name: Build and Package Linux Release
        run: |
          chmod +x scripts/package.sh
          ./scripts/package.sh

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: soeasy-linux-x86_64
          path: dist/soeasy-*-linux-x86_64.zip

  build-windows-x64:
    name: Windows (x64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            git
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt5-base
            mingw-w64-x86_64-opencv
            mingw-w64-x86_64-libxml2
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-uchardet
            zip
          update: true

      - name: Build and Install Cap'n Proto
        run: |
          git clone --depth 1 https://github.com/capnproto/capnproto.git /tmp/capnproto
          cmake -B /tmp/capnproto/build -S /tmp/capnproto/c++ -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DCMAKE_INSTALL_PREFIX="${MINGW_PREFIX}"
          cmake --build /tmp/capnproto/build --target install

      - name: Build SoEasy (Windows x64)
        continue-on-error: true
        run: |
          cmake -B build -S . -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=OFF
          cmake --build build --target soeasy-gui soeasy-worker -j4

      - name: Package Windows Artifacts
        continue-on-error: true
        shell: bash
        run: |
          STAGE_DIR="dist/soeasy-windows-x64"
          mkdir -p "${STAGE_DIR}/bin" "${STAGE_DIR}/dict" "${STAGE_DIR}/models"
          
          # Copy binaries if built
          cp -p build/soeasy-gui.exe "${STAGE_DIR}/bin/" 2>/dev/null || cp -p build/soeasy-gui "${STAGE_DIR}/bin/" || true
          cp -p build/soeasy-worker.exe "${STAGE_DIR}/bin/" 2>/dev/null || cp -p build/soeasy-worker "${STAGE_DIR}/bin/" || true
          
          # Copy dictionaries and models
          cp -rp third_party/cppjieba/dict/* "${STAGE_DIR}/dict/" 2>/dev/null || true
          cp -rp models/ppocr_v6 "${STAGE_DIR}/models/" 2>/dev/null || true
          cp -p README.md "${STAGE_DIR}/" 2>/dev/null || true
          
          # Bundle third-party runtime libraries if present
          if [ -d "third_party/doctotext/lib" ]; then
            cp -d third_party/doctotext/lib/*.dll "${STAGE_DIR}/bin/" 2>/dev/null || true
          fi
          
          cd dist && zip -r -q "../soeasy-windows-x64.zip" "soeasy-windows-x64"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: soeasy-windows-x64
          path: soeasy-windows-x64.zip
          if-no-files-found: warn

  release:
    name: Publish GitHub Release
    needs: [build-linux-x86_64, build-windows-x64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
          generate_release_notes: true
