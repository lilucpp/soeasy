name: Build and Release Binaries

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-linux-x86_64:
    name: Linux (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            qtbase5-dev \
            libopencv-dev \
            libxml2-dev \
            zlib1g-dev \
            libuchardet-dev \
            libcapnp-dev \
            capnproto \
            libboost-dev \
            libboost-nowide-dev \
            zip

      - name: Build and Run Automated Test Suite (CTest Quality Gate)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cmake -B build_test -S . -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTS=ON
          cmake --build build_test -j$(nproc)
          ./build_test/build_dat_dict "third_party/cppjieba/dict/jieba.dict.utf8" "third_party/cppjieba/dict/jieba_dat.bin"
          if ! ctest --test-dir build_test --output-on-failure --timeout 180 -j1; then
            echo "CTest encountered failures. Dumping logs..."
            if [ -f build_test/Testing/Temporary/LastTest.log ]; then
              tail -n 100 build_test/Testing/Temporary/LastTest.log
            fi
            exit 1
          fi

      - name: Upload Linux CTest Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-ctest-logs
          path: |
            build_test/Testing/Temporary/LastTest.log
            build_test/Testing/Temporary/LastTestsFailed.log

      - name: Build and Package Linux Release
        run: |
          chmod +x scripts/package.sh
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            ./scripts/package.sh "${GITHUB_REF_NAME#v}"
          else
            ./scripts/package.sh
          fi

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: soeasy-linux-x86_64
          path: dist/soeasy-*.zip

  build-windows-x64:
    name: Windows (x64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            git
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt5-base
            mingw-w64-x86_64-qt5-tools
            mingw-w64-x86_64-opencv
            mingw-w64-x86_64-libxml2
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-uchardet
            mingw-w64-x86_64-libiconv
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-python
            zip
          update: true

      - name: Build and Install Cap'n Proto
        run: |
          git clone --depth 1 --branch v1.0.1 https://github.com/capnproto/capnproto.git /tmp/capnproto
          cmake -B /tmp/capnproto/build -S /tmp/capnproto/c++ -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DCMAKE_INSTALL_PREFIX="${MINGW_PREFIX}"
          cmake --build /tmp/capnproto/build --target install

      - name: Build SoEasy and Test Suite (Windows x64)
        run: |
          cmake -B build -S . -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=ON
          cmake --build build -j4

      - name: Deploy Runtime DLLs to Build Directory
        run: |
          # Copy third-party runtime DLLs to build directory (same directory as test executables)
          cp -p third_party/doctotext/lib/*.dll build/ 2>/dev/null || true
          cp -p third_party/onnxruntime/lib/*.dll build/ 2>/dev/null || true
          
          # Copy MinGW system runtime libraries to build directory
          cp -p ${MINGW_PREFIX}/bin/libopencv*.dll build/ 2>/dev/null || true
          cp -p ${MINGW_PREFIX}/bin/libuchardet*.dll build/ 2>/dev/null || true
          cp -p ${MINGW_PREFIX}/bin/libxml2*.dll build/ 2>/dev/null || true
          cp -p ${MINGW_PREFIX}/bin/libiconv*.dll build/ 2>/dev/null || true
          cp -p ${MINGW_PREFIX}/bin/zlib1.dll build/ 2>/dev/null || true
          cp -p ${MINGW_PREFIX}/bin/libgcc*.dll build/ 2>/dev/null || true
          cp -p ${MINGW_PREFIX}/bin/libstdc*.dll build/ 2>/dev/null || true
          cp -p ${MINGW_PREFIX}/bin/libwinpthread*.dll build/ 2>/dev/null || true
          cp -p ${MINGW_PREFIX}/bin/libboost_nowide*.dll build/ 2>/dev/null || true

          # Deploy Qt dependencies and plugins into build directory
          WINDEPLOYQT=$(command -v windeployqt-qt5 || command -v windeployqt || true)
          if [ -n "${WINDEPLOYQT}" ]; then
            "${WINDEPLOYQT}" --release --no-translations build/soeasy-gui.exe || true
          fi
          # Ensure headless offscreen platform plugin is also deployed for CI testing
          mkdir -p build/platforms
          cp -p ${MINGW_PREFIX}/share/qt5/plugins/platforms/*.dll build/platforms/ 2>/dev/null || true
          cp -p ${MINGW_PREFIX}/lib/qt5/plugins/platforms/*.dll build/platforms/ 2>/dev/null || true

      - name: Build DAT Dictionary
        run: |
          ./build/build_dat_dict.exe "third_party/cppjieba/dict/jieba.dict.utf8" "third_party/cppjieba/dict/jieba_dat.bin"

      - name: Run Automated Test Suite (Windows CTest Quality Gate)
        env:
          QT_QPA_PLATFORM: offscreen
          QT_PLUGIN_PATH: ${{ github.workspace }}/build
        run: |
          mkdir -p /tmp /d/tmp D:/tmp 2>/dev/null || true
          export QT_PLUGIN_PATH="$(pwd)/build:${MINGW_PREFIX}/share/qt5/plugins:${MINGW_PREFIX}/lib/qt5/plugins:${QT_PLUGIN_PATH}"
          if ! ctest --test-dir build --output-on-failure --timeout 180 -j1; then
            STEP_SUMMARY_PATH=$(cygpath -u "${GITHUB_STEP_SUMMARY:-/tmp/step_summary.md}" 2>/dev/null || echo "${GITHUB_STEP_SUMMARY}")
            echo "### ❌ Windows CTest Failure Report" >> "${STEP_SUMMARY_PATH}"
            if [ -f build/Testing/Temporary/LastTestsFailed.log ]; then
              echo "#### Failed Test List:" >> "${STEP_SUMMARY_PATH}"
              while IFS= read -r line; do
                echo "- \`${line}\`" >> "${STEP_SUMMARY_PATH}"
                echo "::error title=FailedTest::${line}"
              done < build/Testing/Temporary/LastTestsFailed.log
            fi
            if [ -f build/Testing/Temporary/LastTest.log ]; then
              echo "================ CTest LastTest.log ================"
              cat build/Testing/Temporary/LastTest.log || true
              echo "===================================================="
              python3 -c 'import sys; [print("::error title=OfficeFail::" + l.strip()) for l in open("build/Testing/Temporary/LastTest.log", errors="ignore") if "test_office_parser" in l or "CHECK FAILED" in l]' 2>/dev/null || true
            fi
            if grep -q "test_office_parser" build/Testing/Temporary/LastTestsFailed.log 2>/dev/null; then
              echo ">>> Diagnostic direct run of test_office_parser.exe:"
              export PATH="$(pwd)/build:${PATH}"
              (cd build && ./test_office_parser.exe 2>&1) | while IFS= read -r l; do
                echo "::error title=OfficeDirect::${l}"
              done || true
            fi
            exit 1
          fi

      - name: Upload Windows CTest Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-ctest-logs
          path: build/Testing/Temporary/

      - name: Package Windows Artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            VERSION="0.2.1"
          fi
          DIST_NAME="soeasy-v${VERSION}-windows-x64"
          STAGE_DIR="dist/${DIST_NAME}"
          mkdir -p "${STAGE_DIR}/bin" "${STAGE_DIR}/dict" "${STAGE_DIR}/models"
          
          # Copy binaries
          cp -p build/soeasy-gui.exe "${STAGE_DIR}/bin/"
          cp -p build/soeasy-worker.exe "${STAGE_DIR}/bin/"
          
          # Deploy Qt dependencies using windeployqt
          WINDEPLOYQT=$(command -v windeployqt-qt5 || command -v windeployqt || true)
          if [ -n "${WINDEPLOYQT}" ]; then
            "${WINDEPLOYQT}" --release --no-translations "${STAGE_DIR}/bin/soeasy-gui.exe" || true
          fi
          
          # Ensure jieba_dat.bin exists
          if [ ! -f "third_party/cppjieba/dict/jieba_dat.bin" ]; then
            ./build/build_dat_dict.exe "third_party/cppjieba/dict/jieba.dict.utf8" "third_party/cppjieba/dict/jieba_dat.bin"
          fi

          # Copy dictionaries and models
          cp -rp third_party/cppjieba/dict/* "${STAGE_DIR}/dict/" 2>/dev/null || true
          cp -rp models/ppocr_v6 "${STAGE_DIR}/models/" 2>/dev/null || true
          cp -p README.md "${STAGE_DIR}/" 2>/dev/null || true
          mkdir -p "${STAGE_DIR}/icons" && cp -rp resources/icons/* "${STAGE_DIR}/icons/" 2>/dev/null || true
          
          # Bundle third-party runtime libraries
          cp -p third_party/doctotext/lib/*.dll "${STAGE_DIR}/bin/" 2>/dev/null || true
          cp -p third_party/onnxruntime/lib/*.dll "${STAGE_DIR}/bin/" 2>/dev/null || true
          
          # MinGW system libraries that might be dynamically linked
          cp -p ${MINGW_PREFIX}/bin/libopencv*.dll "${STAGE_DIR}/bin/" 2>/dev/null || true
          cp -p ${MINGW_PREFIX}/bin/libuchardet*.dll "${STAGE_DIR}/bin/" 2>/dev/null || true
          cp -p ${MINGW_PREFIX}/bin/libxml2*.dll "${STAGE_DIR}/bin/" 2>/dev/null || true
          cp -p ${MINGW_PREFIX}/bin/libiconv*.dll "${STAGE_DIR}/bin/" 2>/dev/null || true
          cp -p ${MINGW_PREFIX}/bin/zlib1.dll "${STAGE_DIR}/bin/" 2>/dev/null || true
          cp -p ${MINGW_PREFIX}/bin/libgcc*.dll "${STAGE_DIR}/bin/" 2>/dev/null || true
          cp -p ${MINGW_PREFIX}/bin/libstdc*.dll "${STAGE_DIR}/bin/" 2>/dev/null || true
          cp -p ${MINGW_PREFIX}/bin/libwinpthread*.dll "${STAGE_DIR}/bin/" 2>/dev/null || true
          cp -p ${MINGW_PREFIX}/bin/libboost_nowide*.dll "${STAGE_DIR}/bin/" 2>/dev/null || true
          
          cd dist && zip -r -q "${DIST_NAME}.zip" "${DIST_NAME}"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: soeasy-windows-x64
          path: dist/soeasy-*.zip

  release:
    name: Publish GitHub Release
    needs: [build-linux-x86_64, build-windows-x64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
          generate_release_notes: true
